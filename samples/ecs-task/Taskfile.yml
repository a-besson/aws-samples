version: "3"

tasks:
  init:
    desc: Initialize Terraform with the shared S3 state bucket (TF_VAR_state_bucket from .env), migrating an older backend config
    dir: infra
    preconditions:
      - sh: test -n "${TF_VAR_state_bucket:-}"
        msg: Set TF_VAR_state_bucket in .env (see .env.example)
    cmds:
      - terraform init -input=false -migrate-state -backend-config="bucket=${TF_VAR_state_bucket}"

  plan:
    desc: Plan Terraform changes
    dir: infra
    cmds:
      - terraform plan

  apply:
    desc: Apply Terraform changes
    dir: infra
    cmds:
      - terraform apply --auto-approve

  destroy:
    desc: Destroy Terraform resources
    dir: infra
    cmds:
      - terraform destroy --auto-approve

  test:
    desc: Apply the stack on a throwaway Floci container with `terraform test` (no AWS account)
    cmds:
      - task: :tf-floci-test
        vars:
          TF_DIR: "{{.TASKFILE_DIR}}/infra"

  docs:
    desc: Generate Terraform documentation
    dir: infra
    cmds:
      - terraform-docs markdown table --output-file TFDOCS.md --output-mode inject .

  run:
    desc: Execute the ECS task defined in infra/
    cmds:
      - |
        CLUSTER_ARN=$(terraform -chdir=infra output -raw ecs_cluster_arn)
        TASK_DEFINITION_ARN=$(terraform -chdir=infra output -raw ecs_task_definition_arn)
        SUBNET_ID=$(terraform -chdir=infra output -json subnets_private_ids | jq -r '.[0]')
        SECURITY_GROUP_ID=$(terraform -chdir=infra output -raw vpc_endpoint_sg_id)

        aws ecs run-task \
          --cluster "$CLUSTER_ARN" \
          --task-definition "$TASK_DEFINITION_ARN" \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=DISABLED}"
