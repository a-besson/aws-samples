version: "3"

tasks:
  init:
    desc: Initialize Terraform with the shared S3 state bucket (TF_VAR_state_bucket from .env), migrating an older backend config
    dir: infra
    preconditions:
      - sh: test -n "${TF_VAR_state_bucket:-}"
        msg: Set TF_VAR_state_bucket in .env (see .env.example)
    cmds:
      - terraform init -input=false -migrate-state -backend-config="bucket=${TF_VAR_state_bucket}"

  plan:
    desc: Plan Terraform changes
    dir: infra
    cmds:
      - terraform plan

  apply:
    desc: Apply Terraform changes
    dir: infra
    cmds:
      - terraform apply --auto-approve

  destroy:
    desc: Destroy Terraform resources
    dir: infra
    cmds:
      - terraform destroy --auto-approve

  test:
    desc: Apply the stack on a throwaway Floci container with `terraform test` (no AWS account)
    cmds:
      - task: :tf-floci-test
        vars:
          TF_DIR: "{{.TASKFILE_DIR}}/infra"

  docs:
    desc: Generate Terraform documentation
    dir: infra
    cmds:
      - terraform-docs markdown table --output-file TFDOCS.md --output-mode inject .
