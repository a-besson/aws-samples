# Root orchestration: one include per sample, repo-wide quality and security tasks.
version: "3"

dotenv: [.env]

vars:
  # Single sources of the scanner and emulator images, pinned by tag and digest: read by the tasks below and by the CI
  # (check-cyber.yml, _build-sample.yml), kept by Renovate (renovate.json).
  KICS_IMAGE: docker.io/checkmarx/kics:v2.2.1@sha256:49ccc54b6ae7f5d5fc95e96f8f95c18c57f3bba047ab611a03d80792bdff6757
  FLOCI_IMAGE: floci/floci:2.5.0@sha256:a0fbf944d7f338cc0856f1ef83831ea749ff2be71956eb7a7fce08fc21458e19

includes:
  base:
    taskfile: samples/base/Taskfile.yml
    dir: samples/base
  rds-aurora-pg:
    taskfile: samples/rds-aurora-pg/Taskfile.yml
    dir: samples/rds-aurora-pg
  ecs-service:
    taskfile: samples/ecs-service/Taskfile.yml
    dir: samples/ecs-service
  ecs-task:
    taskfile: samples/ecs-task/Taskfile.yml
    dir: samples/ecs-task
  lambda-s3:
    taskfile: samples/lambda-s3/Taskfile.yml
    dir: samples/lambda-s3
  lambda-kinesis:
    taskfile: samples/lambda-kinesis/Taskfile.yml
    dir: samples/lambda-kinesis
  step-function-s3:
    taskfile: samples/step-function-s3/Taskfile.yml
    dir: samples/step-function-s3
  ecs-task-s3:
    taskfile: samples/ecs-task-s3/Taskfile.yml
    dir: samples/ecs-task-s3
  msk-akhq:
    taskfile: samples/msk-akhq/Taskfile.yml
    dir: samples/msk-akhq

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  apply-all:
    desc: Deploy every stack (base first, then the services in parallel)
    cmds:
      - task: base:apply
      - task: apply-samples

  apply-samples:
    internal: true
    deps: [rds-aurora-pg:apply, ecs-service:apply, ecs-task:apply, msk-akhq:apply, lambda-s3:apply, lambda-kinesis:apply, step-function-s3:apply, ecs-task-s3:apply]

  destroy-all:
    desc: Destroy every stack (services in parallel first, then base)
    cmds:
      - task: destroy-samples
      - task: base:destroy

  destroy-samples:
    internal: true
    deps: [rds-aurora-pg:destroy, ecs-service:destroy, ecs-task:destroy, msk-akhq:destroy, lambda-s3:destroy, lambda-kinesis:destroy, step-function-s3:destroy, ecs-task-s3:destroy]

  test-all:
    desc: Run `terraform test` of every stack on Floci, one after the other (the emulator listens on a fixed port)
    cmds:
      - task: base:test
      - task: rds-aurora-pg:test
      - task: ecs-service:test
      - task: ecs-task:test
      - task: msk-akhq:test
      - task: lambda-s3:test
      - task: lambda-kinesis:test
      - task: step-function-s3:test
      - task: ecs-task-s3:test

  tf-floci-test:
    internal: true
    desc: Run `terraform test` of the stack in TF_DIR against a throwaway Floci container (fake credentials, no AWS account)
    cmds:
      - |
        CLI="$(command -v docker || command -v podman)"
        NAME="floci-tf-test-$$"
        TF_DATA_DIR="$(mktemp -d)" # keeps the S3-backed .terraform of `init` untouched
        export TF_DATA_DIR
        cleanup() {
          "$CLI" rm -f "$NAME" >/dev/null 2>&1
          # containers started by Floci itself (databases, brokers, tasks)
          for c in $("$CLI" ps -aq --filter name=floci-aws); do "$CLI" rm -f "$c" >/dev/null 2>&1; done
          rm -rf "$TF_DATA_DIR"
        }
        trap cleanup EXIT
        # loopback only: the emulator has no authentication and drives the Docker socket
        # the asynchronous retries of a Lambda run back to back (AWS waits 1 then 2 minutes): the e2e tests stay short
        "$CLI" run -d --name "$NAME" -p 127.0.0.1:4566:4566 -e FLOCI_RUN_AS_ROOT=true \
          -e FLOCI_SERVICES_LAMBDA_ASYNC_RETRY_DELAY_SECONDS=0 --security-opt label=disable \
          -v /var/run/docker.sock:/var/run/docker.sock {{.FLOCI_IMAGE}} >/dev/null
        for _ in $(seq 1 60); do curl -sf http://localhost:4566/_floci/health >/dev/null && break; sleep 1; done
        cd "{{.TF_DIR}}"
        terraform init -backend=false -input=false
        terraform test

  setup:
    desc: Install workstation dependencies (Brewfile), the Python tooling (.venv), git hooks and TFLint plugins, then check the setup
    cmds:
      - brew bundle --file=Brewfile
      - python3.13 -m venv .venv # the Lambda runtime of the Python samples
      - .venv/bin/pip install --require-virtualenv --quiet -r requirements-dev.txt
      - pre-commit install
      - tflint --init --config=.tflint.hcl
      - task: doctor

  doctor:
    desc: Check that the required tools are available (AWS session is optional)
    silent: true
    cmds:
      - |
        missing=0
        for t in terraform tflint terraform-docs pre-commit gitleaks trivy actionlint podman jq python3.13; do
          command -v "$t" >/dev/null || { echo "MISSING: $t (run: task setup)"; missing=1; }
        done
        if command -v aws >/dev/null; then
          aws sts get-caller-identity >/dev/null 2>&1 || echo "WARNING: no AWS session, only needed for init, plan, apply and destroy"
        else
          echo "WARNING: aws cli not found, only needed for init, plan, apply and destroy"
        fi
        exit $missing

  bootstrap:s3:
    desc: Check or create the S3 bucket of the Terraform state (TF_VAR_state_bucket from .env)
    preconditions:
      - sh: test -n "${TF_VAR_state_bucket:-}"
        msg: Set TF_VAR_state_bucket in .env (see .env.example)
    vars:
      REGION: eu-west-3
    cmds:
      - |
        aws s3api head-bucket --bucket "${TF_VAR_state_bucket}" 2>/dev/null || \
        aws s3 mb "s3://${TF_VAR_state_bucket}" --region {{.REGION}}
      - echo "State bucket is ready."

  lint:
    desc: Run all pre-commit hooks on every file
    cmds:
      - pre-commit run --all-files

  review:
    desc: Run the quality gate (pre-commit) and the security scans (KICS, Trivy)
    cmds:
      - task: lint
      - task: scan

  kics:
    desc: Scan the IaC with KICS (fails on HIGH/CRITICAL)
    cmds:
      - podman machine start >/dev/null 2>&1 || true
      - podman run --rm -v "$PWD:/path:ro" {{.KICS_IMAGE}} scan -p /path --config /path/kics.config --no-progress

  trivy:
    desc: Scan IaC misconfigurations, dependency vulnerabilities and secrets with Trivy (fails on HIGH/CRITICAL)
    cmds:
      - trivy config --config trivy.yaml .
      - trivy fs --config trivy.yaml --scanners vuln,secret .

  scan:
    desc: Run KICS and Trivy
    cmds:
      - task: kics
      - task: trivy
